<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Product Showcase</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');
    
    :root {
      --neon-pink: #ff2a6d;
      --neon-blue: #05d9e8;
      --neon-purple: #d300c5;
      --neon-cyan: #00f7ff;
      --dark-bg: #0d0221;
    }
    
    body {
      margin: 0;
      min-height: 200vh;
      background: var(--dark-bg);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      overflow-x: hidden;
    }

    .intro {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .intro::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, 
                rgba(5, 217, 232, 0.1) 0%, 
                rgba(13, 2, 33, 0) 70%);
      pointer-events: none;
    }

    .intro img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 0 20px var(--neon-pink),
                  0 0 40px rgba(255, 42, 109, 0.3);
      border: 2px solid var(--neon-pink);
      transform: rotate(0deg);
      transition: transform 0.5s, box-shadow 0.5s;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .intro img:hover {
      transform: rotate(-5deg);
      box-shadow: 0 0 30px var(--neon-pink),
                  0 0 60px rgba(255, 42, 109, 0.4);
    }

    .scroll-hint {
      margin-top: 40px;
      color: var(--neon-cyan);
      font-size: 1.2rem;
      text-shadow: 0 0 10px var(--neon-blue);
      position: relative;
    }

    .scroll-hint::after {
      content: '↓';
      display: block;
      margin-top: 10px;
      animation: bounce 2s infinite;
      color: var(--neon-purple);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    .showcase {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: radial-gradient(ellipse at center, 
                rgba(5, 217, 232, 0.05) 0%, 
                rgba(13, 2, 33, 0.9) 70%);
    }

    .showcase.active {
      opacity: 1;
      pointer-events: auto;
    }

    .product-container {
      position: relative;
      width: 350px;
      height: 350px;
      perspective: 1000px;
    }

    .main-product {
      position: absolute;
      width: 200px;
      height: 200px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      filter: drop-shadow(0 0 15px var(--neon-pink));
    }

    .main-product img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      border: 2px solid var(--neon-pink);
      box-shadow: 0 0 30px rgba(255, 42, 109, 0.6),
                  inset 0 0 15px rgba(255, 42, 109, 0.4);
      transition: all 0.5s;
    }

    .feature {
      position: absolute;
      width: 120px;
      height: 120px;
      opacity: 0.5;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1;
      filter: drop-shadow(0 0 10px var(--neon-blue));
      border-radius: 15px;
      overflow: hidden;
    }

    .feature::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent,
        rgba(255, 42, 109, 0.2),
        transparent
      );
      transform: rotate(45deg);
      transition: all 0.6s;
      opacity: 0;
    }

    .feature img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid var(--neon-blue);
      transition: all 0.5s;
    }

    .feature.active {
        position: relative;
        width: 200px;
        height: 200px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        
      opacity: 1;
      transform: scale(1.3);
      z-index: 3;
      filter: drop-shadow(0 0 20px var(--neon-purple));
    }

    .feature.active img {
      border-color: var(--neon-purple);
      box-shadow: 0 0 30px rgba(211, 0, 197, 0.6),
                  inset 0 0 15px rgba(211, 0, 197, 0.4);
    }

    .feature.active::before {
      opacity: 1;
      animation: shine 1.5s infinite;
    }

    @keyframes shine {
      0% { transform: rotate(45deg) translate(-30%, -30%); }
      100% { transform: rotate(45deg) translate(30%, 30%); }
    }

    /* Feature positions with neon glow effects */
    .feature1 { 
      top: 30px; 
      left: 30px; 
      border: 1px solid var(--neon-blue);
      box-shadow: 0 0 15px rgba(5, 217, 232, 0.4);
    }
    .feature2 { 
      bottom: 30px; 
      left: 30px; 
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 247, 255, 0.4);
    }
    .feature3 { 
      top: 30px; 
      right: 30px; 
      border: 1px solid var(--neon-pink);
      box-shadow: 0 0 15px rgba(255, 42, 109, 0.4);
    }
    .feature4 { 
      bottom: 30px; 
      right: 30px; 
      border: 1px solid var(--neon-purple);
      box-shadow: 0 0 15px rgba(211, 0, 197, 0.4);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .intro img {
        width: 180px;
        height: 180px;
      }
      
      .product-container {
        width: 300px;
        height: 300px;
      }
      
      .main-product {
        width: 160px;
        height: 160px;
      }
      
      .feature {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>

<div class="intro">
  <img src="./earphone1.jpg" alt="Product">
  <p class="scroll-hint">Scroll down to explore features</p>
</div>

<div class="showcase">
  <div class="product-container">
    <div class="main-product">
      <img src="./earphone1.jpg" alt="Product">
    </div>

    <div class="feature feature1">
      <img src="./car.jpg" alt="Feature 1">
    </div>
    <div class="feature feature2">
      <img src="./earbuds.jpg" alt="Feature 2">
    </div>
    <div class="feature feature3">
      <img src="./mobile1.jpg" alt="Feature 3">
    </div>
    <div class="feature feature4">
      <img src="./earphone1.jpg" alt="Feature 4">
    </div>
  </div>
</div>

<script>
  // Show showcase when scrolled
  window.addEventListener('scroll', function() {
    const showcase = document.querySelector('.showcase');
    if (window.scrollY > 100) {
      showcase.classList.add('active');
      startAnimation();
    } else {
      showcase.classList.remove('active');
      stopAnimation();
    }
  });

  // Feature animation
  let current = 0;
  let interval;
  const features = document.querySelectorAll('.feature');

  function showNextFeature() {
    features.forEach((feature, index) => {
      feature.classList.toggle('active', index === current);
    });
    current = (current + 1) % features.length;
  }

  function startAnimation() {
    if (!interval) {
      showNextFeature();
      interval = setInterval(showNextFeature, 2000);
    }
  }

  function stopAnimation() {
    clearInterval(interval);
    interval = null;
    features.forEach(feature => feature.classList.remove('active'));
  }

  // Add subtle parallax effect
  window.addEventListener('mousemove', (e) => {
    if (!document.querySelector('.showcase').classList.contains('active')) return;
    
    const x = (window.innerWidth / 2 - e.pageX) / 30;
    const y = (window.innerHeight / 2 - e.pageY) / 30;
    document.querySelector('.product-container').style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
  });
</script>

</body>
</html>
